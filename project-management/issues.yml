# =============================================================================
# issues.yml
# Data source for create-issues.sh.
# Edit this file to change repo, project, labels, or issue content.
# The script contains no magic strings — everything lives here.
# =============================================================================

config:
  repo: "Ach57/joplin-comp-354-dev"
  project: "joplin-comp-354-dev-project"

# Labels that must exist before issues are created.
labels:
  - name: epic
    description: "High-level epic grouping"
    color: "0075ca"
  - name: feature
    description: "Feature-level work item"
    color: "e4e669"
  - name: backlog
    description: "Backlog work item"
    color: "add8e6"

# Issues to create, in order. Each entry needs: title, label, body.
issues:
  - title: "Epic: Offline Thesaurus Plugin"
    label: epic
    body: |
      ## Overview

      Add an **offline synonym suggestion** feature to Joplin using WordNet as the lexical database and the MiniLM sentence-transformer model for semantic re-ranking.

      ## Goals

      - Provide synonym suggestions entirely offline — no network call after initial setup.
      - Integrate naturally into the Joplin editor (right-click or keyboard shortcut).
      - Keep latency low enough to feel instant on typical developer hardware.

      ## Features

      This epic is broken down into the following feature issues:

      1. User Interaction & UX
      2. WordNet Synonym Retrieval
      3. Semantic Ranking Engine
      4. Offline Experience
      5. Performance & Optimization
      6. Quality Assurance
      7. Documentation & Release Readiness

      ## Out of Scope

      - Online thesaurus APIs
      - Languages other than English (v1)
      - Mobile (Joplin mobile) support in v1

  - title: "Feature: User Interaction & UX"
    label: feature
    body: |
      ## Description

      Design and implement the editor-side surface that lets a user trigger synonym suggestions and apply a chosen synonym.

      ## Acceptance Criteria

      - [ ] User can invoke the thesaurus via right-click context menu on a selected word.
      - [ ] User can invoke the thesaurus via a configurable keyboard shortcut.
      - [ ] A dropdown/popup lists up to 10 ranked synonym suggestions.
      - [ ] Selecting a suggestion replaces the selected word in-place without losing surrounding formatting.
      - [ ] If no synonyms are found, a user-friendly 'No synonyms found' message is shown.
      - [ ] The UI is accessible (keyboard-navigable, screen-reader friendly).

      ## Related Epic

      Epic: Offline Thesaurus Plugin

  - title: "Feature: WordNet Synonym Retrieval"
    label: feature
    body: |
      ## Description

      Implement the module responsible for querying the bundled WordNet database to retrieve candidate synonyms for a given input word.

      ## Acceptance Criteria

      - [ ] WordNet data files are bundled with the plugin (no network fetch at runtime).
      - [ ] Given a word, the module returns all synset members across relevant POS tags (noun, verb, adjective, adverb).
      - [ ] Lookup completes in < 50 ms on a modern laptop.
      - [ ] Unknown words return an empty list without throwing.
      - [ ] Case-insensitive lookup is supported.

      ## Related Epic

      Epic: Offline Thesaurus Plugin

  - title: "Feature: Semantic Ranking Engine"
    label: feature
    body: |
      ## Description

      Integrate the MiniLM sentence-transformer model to semantically re-rank raw WordNet synonyms by contextual relevance to the sentence in which the target word appears.

      ## Acceptance Criteria

      - [ ] The MiniLM model weights are bundled or fetched once and cached locally.
      - [ ] Candidates are ranked by cosine similarity between the candidate embedding and the surrounding-sentence embedding.
      - [ ] Re-ranking completes in < 200 ms for a candidate list of ≤ 50 words.
      - [ ] Ranking is deterministic for identical inputs.
      - [ ] The engine exposes a clean interface: `rank(word, context, candidates[]) → RankedSynonym[]`.

      ## Related Epic

      Epic: Offline Thesaurus Plugin

  - title: "Feature: Offline Experience"
    label: feature
    body: |
      ## Description

      Ensure the plugin works fully offline after initial setup, with clear guidance for first-time model download.

      ## Acceptance Criteria

      - [ ] Plugin works with no internet connection after the first-run model download.
      - [ ] On first use, the plugin prompts the user to download model weights and shows progress.
      - [ ] If the download fails, an actionable error message is displayed.
      - [ ] WordNet data is included in the plugin bundle — no separate download needed.
      - [ ] Plugin does not make any network requests once assets are cached.

      ## Related Epic

      Epic: Offline Thesaurus Plugin

  - title: "Feature: Performance & Optimization"
    label: feature
    body: |
      ## Description

      Profile and optimise the critical path (WordNet lookup → MiniLM inference → UI render) so that the end-to-end response feels instant.

      ## Acceptance Criteria

      - [ ] End-to-end synonym suggestion (lookup + ranking + display) completes in < 300 ms on reference hardware (2020 MacBook Pro M1).
      - [ ] WordNet index is pre-parsed into a fast lookup structure (e.g. SQLite or binary trie) at build time.
      - [ ] MiniLM inference runs on a background thread / worker so the editor UI is never blocked.
      - [ ] Memory footprint of the plugin does not exceed 150 MB at rest.
      - [ ] Performance benchmarks are tracked in CI with a regression threshold.

      ## Related Epic

      Epic: Offline Thesaurus Plugin

  - title: "Feature: Quality Assurance"
    label: feature
    body: |
      ## Description

      Establish the testing strategy and implement the test suite covering unit, integration, and end-to-end scenarios.

      ## Acceptance Criteria

      - [ ] Unit tests cover WordNet retrieval module with ≥ 90 % line coverage.
      - [ ] Unit tests cover the semantic ranking engine with known fixture inputs.
      - [ ] Integration tests verify the full lookup → rank → display pipeline.
      - [ ] Tests run offline (no network dependency in CI).
      - [ ] All tests pass on macOS, Windows, and Linux CI runners.
      - [ ] Linting and type-checking are enforced in CI.

      ## Related Epic

      Epic: Offline Thesaurus Plugin

  - title: "Feature: Documentation & Release Readiness"
    label: feature
    body: |
      ## Description

      Write end-user and developer documentation, configure packaging, and prepare the plugin for submission to the Joplin plugin repository.

      ## Acceptance Criteria

      - [ ] README documents installation, first-run model download, and keyboard shortcuts.
      - [ ] CHANGELOG follows Keep a Changelog format; v1.0.0 entry is complete.
      - [ ] Plugin manifest (`manifest.json`) is valid and all required fields are populated.
      - [ ] Plugin is packaged with `jpm pack` and the resulting `.jpl` installs cleanly.
      - [ ] Developer docs explain the architecture, how to run tests, and how to contribute.
      - [ ] Plugin passes Joplin's official plugin submission checklist.

      ## Related Epic

      Epic: Offline Thesaurus Plugin

  - title: "Backlog: Define TS-Python API Contract"
    label: backlog
    body: |
      ## Description

      Define the communication contract between the TypeScript plugin and the Python NLP pipeline. This contract specifies the request payload, response payload, and error formats exchanged between both components.

      ## Why Is It Needed?

      Without a clear contract, frontend, integration, and NLP development become tightly coupled and error-prone. A stable API allows both sides to develop independently.


      ## Example

      Request:

      ```json
      {
        "word": "large",
        "sentence": "The large building overlooks the river."
      }
      ```

      Response:
      ```json
      {
      "synonyms": [
        {
          "word": "huge",
          "score": 0.94
        },
        {
          "word": "big",
          "score": 0.91
        }
      ]
      }
      ```

      ## Related Feature

      Parent Ticket: Semantic Ranking Engine

  - title: "Define Ranking Request and Response Schemas"
    label: backlog
    body: |
      ## Description

      Create the TypeScript types and interfaces that represent requests and responses exchanged with the Python ranking service.

      ## Why Is It Needed?

      Provides type safety and prevents malformed requests or responses throughout the application.

      ## Example

      ```TypeScript
      interface RankingRequest {
        word: string;
        sentence: string;
      }

      interface RankedSynonym {
        word: string;
        score: number;
      }

      interface RankingResponse {
        synonyms: RankedSynonym[];
      }
      ```

      ## Related Feature

      Parent Ticket: Semantic Ranking Engine

  - title: "Implement Python Process Manager"
    label: backlog
    body: |
      ## Description

      Create a service responsible for launching, monitoring, and terminating the Python NLP process from the Joplin plugin.

      ## Why Is It Needed?

      The TypeScript application must be able to communicate with the Python ranking engine in a reliable and controlled manner.

      ## Example

      ```TypeScript
      const process = spawn("python", ["rank.py"]);
      ```

      ## Related Feature

      Parent Ticket: Semantic Ranking Engine

  - title: "Create Ranking Service Wrapper"
    label: backlog
    body: |
      ## Description

      Provide a clean TypeScript abstraction that hides the details of Python communication from the rest of the application.

      ## Why Is It Needed?

      Frontend code should not need to know how NLP processing is performed.

      ## Example

      ```TypeScript
      const results = await rankingService.getSuggestions(
        "large",
        "The large building overlooks the river."
      );
      ```
      ## Related Feature

      Parent Ticket: Semantic Ranking Engine

  - title: "Implement Python Error and Timeout Handling"
    label: backlog
    body: |
      ## Description

      Handle failures occurring during communication with the Python NLP process.

      ## Why Is It Needed?

      Prevents the plugin from freezing or crashing when the NLP service fails.

      ## Related Feature

      Parent Ticket: Semantic Ranking Engine

  - title: "Create Context Menu Integration"
    label: backlog
    body: |
      ## Description

      Add a "Find Synonyms" option to the editor's right-click context menu. The option should only be available when a word is selected and should trigger the synonym lookup workflow.

      ## Example

      User selects the word "large".

      Right-click menu:
      - Copy
      - Paste
      - Find Synonyms

      Selecting "Find Synonyms" starts the synonym lookup process.

      ## Related Feature

      Parent Ticket: User Interaction & UX

  - title: "Implement Keyboard Shortcut Support"
    label: backlog
    body: |
      ## Description

      Implement a keyboard shortcut that allows users to trigger synonym lookup without using the mouse. The shortcut should be configurable through plugin settings.

      ## Example

      User selects the word "large".

      Presses:
      Ctrl + Shift + S

      The synonym lookup process is triggered.

      ## Related Feature

      Parent Ticket: User Interaction & UX

  - title: "Create Synonym Suggestion Dropdown"
    label: backlog
    body: |
      ## Description

      Create a dropdown or popup component that displays returned synonym suggestions. The component should show up to three ranked synonyms returned by the backend.

      ## Example

      Synonym Suggestions

      - huge
      - big
      - massive

      Selecting a synonym applies it to the editor.

      ## Related Feature

      Parent Ticket: User Interaction & UX

  - title: "Implement Word Replacement Logic"
    label: backlog
    body: |
      ## Description

      Replace the currently selected word with the synonym chosen by the user while preserving the surrounding note content and formatting.

      ## Example

      Before:
      The large building overlooks the river.

      User selects:
      huge

      After:
      The huge building overlooks the river.

      ## Related Feature

      Parent Ticket: User Interaction & UX

  - title: "Implement No Results State"
    label: backlog
    body: |
      ## Description

      Display a clear and user-friendly message when the backend returns no valid synonym suggestions.

      ## Example

      Lookup Result:

      "No synonyms found for the selected word."

      ## Related Feature

      Parent Ticket: User Interaction & UX

  - title: "Implement Error Display"
    label: backlog
    body: |
      ## Description

      Display meaningful error messages when synonym lookup fails due to backend, Python, or processing errors.

      ## Example

      Error:
      "Unable to retrieve synonym suggestions. Please try again."

      Possible causes:
      - Python service unavailable
      - Request timeout
      - Unexpected processing error

      ## Related Feature

      Parent Ticket: User Interaction & UX

  - title: "Accessibility & Keyboard Navigation"
    label: backlog
    body: |
      ## Description

      Ensure all synonym-related UI components are accessible and can be fully used via keyboard navigation.

      ## Example

      - User opens synonym dropdown using a keyboard shortcut.
      - Arrow keys navigate suggestions.
      - Enter selects a synonym.
      - Escape closes the dropdown.

      ## Related Feature

      Parent Ticket: User Interaction & UX

  - title: "Evaluate WordNet Library Options"
    label: backlog
    body: |
      ## Description

      Research and select the most appropriate WordNet library for the NLP pipeline based on functionality, performance, and ease of integration.

      ## Example

      Compare:
      - NLTK WordNet
      - WordNet package
      - Custom database implementation

      Document the selected option and rationale.

      ## Related Feature

      Parent Ticket: WordNet Synonym Retrieval

  - title: "Implement WordNet Data Access Layer"
    label: backlog
    body: |
      ## Description  

      Create a reusable module responsible for loading and querying WordNet data.

      ## Example

      Input:
      "large"

      Output:
      ["big", "huge", "massive", ...]

      ## Related Feature

      Parent Ticket: WordNet Synonym Retrieval

  - title: "Implement Synonym Candidate Retrieval"
    label: backlog
    body: |
      ## Description

      Retrieve all available synonym candidates for a given word across supported parts of speech.

      ## Example

      Input:
      "large"

      Output:
      ["big", "huge", "great", "massive"]

      ## Related Feature

      Parent Ticket: WordNet Synonym Retrieval

  - title: "Implement Case-Insensitive Lookup"
    label: backlog
    body: |
      ## Description

      Ensure synonym lookup returns the same results regardless of the word's capitalization.

      ## Example

      The following inputs should return identical results:

      - "large"
      - "Large"
