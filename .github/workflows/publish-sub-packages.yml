name: Publish sub-packages

# The tag is created and pushed by `yarn publishAll`. Publishing uses npm trusted publishing, so no
# token is needed, but each package must have this workflow registered as a trusted publisher on
# npmjs.com.
on:
  push:
    tags:
      - 'sub-packages-v*'

permissions:
  contents: read
  id-token: write

jobs:
  Publish:
    if: github.repository == 'laurent22/joplin'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/workflows/shared/setup-build-environment

      # Trusted publishing does not work without registry-url
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: Install and build
        env:
          IS_CONTINUOUS_INTEGRATION: 1
          BUILD_SEQUENCIAL: 1
        run: |
          source "${GITHUB_WORKSPACE}/.github/scripts/retry.sh"
          retry yarn install

      - name: Publish
        run: node packages/tools/releaseSubPackages.js publish
