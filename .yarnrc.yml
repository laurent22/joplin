checksumBehavior: update

compressionLevel: mixed

enableGlobalCache: true

logFilters:
  - code: YN0086
    level: discard
  - code: YN0060
    level: discard
  - code: YN0002
    level: discard
  - code: YN0013
    level: discard

nmHoistingLimits: workspaces

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.9.2.cjs
